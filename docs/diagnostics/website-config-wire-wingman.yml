# ─────────────────────────────────────────────────────────────────────────────
# One-off, write, `workflow_dispatch`-only (2026-09-04) -- NOT part of regular CI.
#
# Wires open-wingman.php's config guard (open-wingman.php:61) by writing the 5
# .htaccess `SetEnv` lines it reads via getenv(): SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY, WINGCOMMANDER_API_URL, WINGCOMMANDER_HANDOFF_SECRET,
# WINGCOMMANDER_URL. See servermemory.md (2026-09-04) for the full investigation
# that led here -- website-config-diagnostic.yml confirmed none of these were
# set at all, meaning every real call to open-wingman.php 500ed before ever
# reaching Supabase or WingCommander.
#
# Safety:
#  - Backs up .htaccess (timestamped copy) before writing anything.
#  - Idempotent: skips any SetEnv name that's already present rather than
#    duplicating it, so a re-run is harmless.
#  - Secret values (SUPABASE_SERVICE_ROLE_KEY, WINGCOMMANDER_HANDOFF_SECRET) are
#    passed as positional args to the remote script (same pattern as
#    install-wordpress-blog.yml's admin-password reset step) -- never
#    interpolated into the heredoc itself, never echoed. Non-secret values
#    (SUPABASE_URL, WINGCOMMANDER_API_URL, WINGCOMMANDER_URL) are inlined
#    directly since they're not sensitive.
#  - Once used, move to docs/diagnostics/ per this repo's established
#    one-off-workflow lifecycle, don't delete.
# ─────────────────────────────────────────────────────────────────────────────
name: (one-off) Wire WingCommander .htaccess SetEnv secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wire:
    runs-on: ubuntu-latest
    environment: hostinger-production
    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
      HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
      HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      HOSTINGER_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WINGCOMMANDER_HANDOFF_SECRET: ${{ secrets.WINGCOMMANDER_HANDOFF_SECRET }}
    steps:
      - name: Configure verified SSH
        run: |
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_PORT"
          test -n "$HOSTINGER_USERNAME"
          test -n "$HOSTINGER_SSH_KEY"
          test -n "$HOSTINGER_SSH_KNOWN_HOSTS"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$WINGCOMMANDER_HANDOFF_SECRET"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/hostinger_deploy_key
          printf '%s\n' "$HOSTINGER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/hostinger_deploy_key
          chmod 644 ~/.ssh/known_hosts

      - name: Back up + write .htaccess SetEnv lines (idempotent)
        run: |
          ssh -i ~/.ssh/hostinger_deploy_key -p "$HOSTINGER_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$HOSTINGER_USERNAME@$HOSTINGER_HOST" \
            bash -s -- "$SUPABASE_SERVICE_ROLE_KEY" "$WINGCOMMANDER_HANDOFF_SECRET" \
            <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "/home/u117990013/domains/thekpihub.com/public_html"

          SUPABASE_SERVICE_ROLE_KEY="$1"
          WINGCOMMANDER_HANDOFF_SECRET="$2"

          backup=".htaccess.bak-$(date +%Y%m%d%H%M%S)"
          cp .htaccess "$backup"
          echo "Backed up .htaccess -> $backup"

          add_setenv() {
            local name="$1" value="$2"
            if grep -qE "^[[:space:]]*SetEnv[[:space:]]+$name([[:space:]]|\$)" .htaccess; then
              echo "SKIP (already present): $name"
            else
              printf 'SetEnv %s "%s"\n' "$name" "$value" >> .htaccess
              echo "ADDED: $name"
            fi
          }

          echo "# --- WingCommander handoff config, added $(date -u +%Y-%m-%dT%H:%M:%SZ) ---" >> .htaccess

          add_setenv SUPABASE_URL "https://eeuwkislidznpgdbvvbo.supabase.co"
          add_setenv SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          add_setenv WINGCOMMANDER_API_URL "https://ditto-wingman-backend-production-85f6.up.railway.app"
          add_setenv WINGCOMMANDER_HANDOFF_SECRET "$WINGCOMMANDER_HANDOFF_SECRET"
          add_setenv WINGCOMMANDER_URL "https://wingcommander.thekpihub.com"

          echo
          echo "=== SetEnv variable NAMES now present (never values) ==="
          grep -oE '^[[:space:]]*SetEnv[[:space:]]+[A-Z0-9_]+' .htaccess | awk '{print $2}' | sort -u
          REMOTE_SCRIPT

      - name: Summary
        run: echo "Wired WingCommander .htaccess SetEnv lines on thekpihub.com. See job log for which names were added vs already present." >> "$GITHUB_STEP_SUMMARY"
