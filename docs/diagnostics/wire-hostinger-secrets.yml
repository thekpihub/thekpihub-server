name: One-off - Wire OpenRouter + Brevo keys into Hostinger's .htaccess

# One-off, idempotent write. Appends SetEnv lines for OPENROUTER_API_KEY and
# BREVO_API_KEY to the live .htaccess if they are not already present.
# Never echoes a raw secret value into the log -- values are piped straight
# into the remote append command via stdin, not interpolated into any
# printed string. Per repo convention, move this file to docs/diagnostics/
# after use instead of deleting it.

on:
  workflow_dispatch: {}

jobs:
  wire-secrets:
    runs-on: ubuntu-latest
    environment: hostinger-production
    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
      HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
      HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      HOSTINGER_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/hostinger_deploy_key
          printf '%s\n' "$HOSTINGER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/hostinger_deploy_key
          chmod 644 ~/.ssh/known_hosts

      - name: Append SetEnv lines if not already present (idempotent, values never echoed)
        run: |
          WEBROOT="/home/$HOSTINGER_USERNAME/domains/thekpihub.com/public_html"
          SSH_CMD="ssh -i ~/.ssh/hostinger_deploy_key -p $HOSTINGER_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes $HOSTINGER_USERNAME@$HOSTINGER_HOST"

          $SSH_CMD "grep -q '^SetEnv OPENROUTER_API_KEY' '$WEBROOT/.htaccess'" \
            && echo "OPENROUTER_API_KEY already present -- skipping" \
            || { printf 'SetEnv OPENROUTER_API_KEY %s\n' "$OPENROUTER_API_KEY" | $SSH_CMD "cat >> '$WEBROOT/.htaccess'"; echo "OPENROUTER_API_KEY appended"; }

          $SSH_CMD "grep -q '^SetEnv BREVO_API_KEY' '$WEBROOT/.htaccess'" \
            && echo "BREVO_API_KEY already present -- skipping" \
            || { printf 'SetEnv BREVO_API_KEY %s\n' "$BREVO_API_KEY" | $SSH_CMD "cat >> '$WEBROOT/.htaccess'"; echo "BREVO_API_KEY appended"; }

      - name: Verify both lines now exist (presence only, values never printed)
        run: |
          WEBROOT="/home/$HOSTINGER_USERNAME/domains/thekpihub.com/public_html"
          ssh -i ~/.ssh/hostinger_deploy_key -p "$HOSTINGER_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$HOSTINGER_USERNAME@$HOSTINGER_HOST" \
            "grep -c '^SetEnv OPENROUTER_API_KEY\|^SetEnv BREVO_API_KEY' '$WEBROOT/.htaccess'"

      - name: Functionally verify each value against its provider (from the server's own network, values never printed)
        run: |
          WEBROOT="/home/$HOSTINGER_USERNAME/domains/thekpihub.com/public_html"
          SSH_CMD="ssh -i ~/.ssh/hostinger_deploy_key -p $HOSTINGER_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes $HOSTINGER_USERNAME@$HOSTINGER_HOST"
          $SSH_CMD "
            OR_KEY=\$(grep -oP '(?<=SetEnv OPENROUTER_API_KEY ).*' '$WEBROOT/.htaccess')
            BR_KEY=\$(grep -oP '(?<=SetEnv BREVO_API_KEY ).*' '$WEBROOT/.htaccess')
            echo -n 'OpenRouter: HTTP '
            curl -s -o /tmp/or.json -w '%{http_code}\n' -H \"Authorization: Bearer \$OR_KEY\" https://openrouter.ai/api/v1/auth/key
            grep -oE '\"(limit|usage|label)\":[^,}]*' /tmp/or.json || true
            echo -n 'Brevo: HTTP '
            curl -s -o /tmp/brevo.json -w '%{http_code}\n' -H \"api-key: \$BR_KEY\" https://api.brevo.com/v3/account
            grep -oE '\"(email|plan)\":[^,}]*' /tmp/brevo.json | head -5 || true
          "
