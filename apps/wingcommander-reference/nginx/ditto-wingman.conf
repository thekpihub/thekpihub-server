server {
    listen 80;
    listen [::]:80;
    server_name _;   # Replace _ with your domain when ready

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # ── Weapons — static HTML files ───────────────────────
    location /weapons/ {
        alias /var/www/html/weapons/;
        index narrative.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";

        # Allow access
        autoindex on;
    }

    # ── Next.js app (reverse proxy to PM2) ───────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;

        # If Next.js is down, show weapons index
        error_page 502 503 504 /weapons/;
    }

    # Logs
    access_log /var/log/nginx/ditto-wingman-access.log;
    error_log  /var/log/nginx/ditto-wingman-error.log;
}
