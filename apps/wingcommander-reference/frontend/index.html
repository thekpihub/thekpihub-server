<!doctype html>
<html lang="en" class="dark">
  <head>
    <!-- Prevent theme flash -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("ditto-theme");
          if (!theme) {
            var isLoggedIn = Object.keys(localStorage).some(function (k) {
              return k.startsWith("sb-") && k.endsWith("-auth-token");
            });
            theme = isLoggedIn ? "dark" : "system";
          }
          if (
            theme === "light" ||
            (theme === "system" && window.matchMedia("(prefers-color-scheme: light)").matches)
          ) {
            document.documentElement.classList.remove("dark");
            document.documentElement.classList.add("light");
          }
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta Tags -->
    <title>Ditto Wingman</title>
    <meta name="title" content="Ditto Wingman - Enhanced AI Agent Platform | Self-Hosted" />
    <meta
      name="description"
      content="A unified self-hosted AI agent — LLM, code, RAG, image generation and autonomous agents. For humanity. Forever."
    />
    <meta
      name="keywords"
      content="AI agent, self-hosted AI, autonomous agents, code generation, RAG, image generation, LLM"
    />
    <meta name="author" content="Ditto Wingman" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ditto Wingman - Enhanced AI Agent Platform" />
    <meta
      property="og:description"
      content="A unified self-hosted AI agent — LLM, code, RAG, image generation and autonomous agents. For humanity. Forever."
    />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
