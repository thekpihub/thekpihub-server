# KPI Hub public-source denial fragment.
# Contains no credentials. Append to the server-managed public_html/.htaccess
# only after backing up that file. Keep config.js and runtime PHP/JS accessible.

<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteRule ^(?:docs|tools|wp-plugin|\.github)(?:/|$) - [F,L,NC]
  RewriteRule ^(?:api/index\.js|server\.js|tailwind\.config\.js|\.babelrc|\.firebaserc|\.deploy-exclude|\.nojekyll)$ - [F,L,NC]
</IfModule>

<FilesMatch "\.(md|markdown|py|pyc|pyo|jsx|mjs|map|sh|bash|sql|ini|log|bak|old|orig|swp|template|yml|yaml|toml|lock|doc|docx)$">
  <IfModule mod_authz_core.c>
    Require all denied
  </IfModule>
  <IfModule !mod_authz_core.c>
    Deny from all
  </IfModule>
</FilesMatch>

<FilesMatch "^(package\.json|package-lock\.json|vercel\.json|firebase\.json|requirements\.txt|config\.example\.js|CNAME|LICENSE|Dockerfile|Procfile|Makefile)$">
  <IfModule mod_authz_core.c>
    Require all denied
  </IfModule>
  <IfModule !mod_authz_core.c>
    Deny from all
  </IfModule>
</FilesMatch>
