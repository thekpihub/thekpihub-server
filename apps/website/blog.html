<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intelligence Feed — The KPI Hub</title>
  <meta name="description" content="The KPI Hub Intelligence Feed — AI-synthesized SaaS insights, funding signals, benchmark shifts, and decision-grade intelligence published daily.">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="2;url=https://blog.thekpihub.com/">
  <link rel="canonical" href="https://blog.thekpihub.com/">
  <link rel="icon" href="assets/favicon-new.svg?v=d6470a38" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #30363d;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --accent:    #0ea5e9;
      --radius:    10px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
    }
    .logo-mark {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; color: #fff;
    }
    .logo-text { font-size: 14px; font-weight: 700; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      max-width: 440px;
    }

    .spinner {
      display: inline-block; width: 28px; height: 28px;
      border: 3px solid rgba(255,255,255,.15); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 24px; }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 14px; font-weight: 600;
    }
    .btn:hover { background: #38bdf8; }
  </style>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DZPCCPEP1J"></script>

    gtag("js", new Date());
    gtag("config", "G-DZPCCPEP1J");
  </script>
</head>
<body>

<div class="logo">
  <div class="logo-mark">K</div>
  <div class="logo-text">The KPI Hub</div>
</div>

<div class="card">
  <div class="spinner"></div>
  <h1>The blog moved</h1>
  <p>Daily SaaS intelligence now publishes at blog.thekpihub.com. Taking you there now.</p>
  <a class="btn" href="https://blog.thekpihub.com/">Go to the blog →</a>
</div>

</body>
</html>
