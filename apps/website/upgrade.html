<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Plan · The KPI Hub</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- No meta-refresh: the destination depends on whether a session hand-off is possible
       (see script below), and a static refresh can't carry that decision. The noscript
       fallback link below covers the no-JS case. -->
  <link rel="icon" href="assets/favicon-new.svg?v=d6470a38" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #30363d;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --accent:    #0ea5e9;
      --radius:    10px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
    }
    .logo-mark {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; color: #fff;
    }
    .logo-text { font-size: 14px; font-weight: 700; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      max-width: 440px;
    }

    .spinner {
      display: inline-block; width: 28px; height: 28px;
      border: 3px solid rgba(255,255,255,.15); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 24px; }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 14px; font-weight: 600;
    }
    .btn:hover { background: #38bdf8; }
  </style>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1XJCJ3X004"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-1XJCJ3X004");
  </script>
</head>
<body>

<div class="logo">
  <div class="logo-mark">K</div>
  <div class="logo-text">The KPI Hub</div>
</div>

<div class="card">
  <div class="spinner"></div>
  <h1 id="upgradeTitle">Plans moved</h1>
  <p id="upgradeMessage">Billing now lives in The KPI Hub platform. Taking you there now — sign in if asked, then pick Growth or reach out for Enterprise.</p>
  <a class="btn" id="upgradeFallbackLink" href="https://app.thekpihub.com/dashboard/billing">Go to Billing →</a>
</div>

<noscript>
  <p style="margin-top:16px;">JavaScript is off, so this page can't sign you in automatically —
  use the button above, then sign in on the platform if asked.</p>
</noscript>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  // Session hand-off to app.thekpihub.com: this site (thekpihub.com) uses a plain
  // localStorage-based Supabase client; app.thekpihub.com uses @supabase/ssr cookies.
  // Neither storage mechanism crosses subdomains on its own, but both apps share the
  // same Supabase project, so a valid access/refresh token pair from a session here is
  // a portable credential there too -- pass it through app.thekpihub.com/auth/handoff
  // instead of dropping the session on a dumb redirect (which is what this page did
  // before, silently sending signed-in users to a second, separate login).
  (async () => {
    const { createClient } = supabase;
    const sb = createClient(CONFIG.supabase.url, CONFIG.supabase.anonKey);
    const { data: { session } } = await sb.auth.getSession();

    if (!session) {
      // Not signed in here either -- go through this site's own login first,
      // same as every other cross-app entry point (e.g. WingCommander's).
      document.getElementById('upgradeTitle').textContent = 'Sign in to continue';
      document.getElementById('upgradeMessage').textContent = 'Redirecting you to sign in...';
      window.location.replace(CONFIG.app.loginUrl);
      return;
    }

    const hash = new URLSearchParams({
      access_token: session.access_token,
      refresh_token: session.refresh_token,
    });
    const dest = 'https://app.thekpihub.com/auth/handoff?redirect=%2Fdashboard%2Fbilling#' + hash.toString();
    document.getElementById('upgradeFallbackLink').href = dest;
    window.location.replace(dest);
  })();
</script>
<script src="/gk-shortcut.js?v=9fc0c955"></script>
</body>
</html>
