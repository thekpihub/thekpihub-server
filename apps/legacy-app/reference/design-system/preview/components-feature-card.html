<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);width:700px;box-sizing:border-box;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .card{padding:20px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:12px;position:relative;overflow:hidden;}
  .card.hover{border-color:rgba(233,161,35,0.28);}
  .card.hover::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--teal));}
  .icon{width:44px;height:44px;border-radius:10px;background:rgba(233,161,35,0.18);border:1px solid rgba(233,161,35,0.28);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .title{font-family:var(--font-head);font-size:15px;font-weight:700;margin-bottom:6px;color:var(--text);}
  .text{font-family:var(--font-body);font-size:12px;color:var(--text-2);line-height:1.6;}
  .state{position:absolute;top:10px;right:12px;font-family:var(--font-head);font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-3);}
</style></head><body>
  <div class="card">
    <div class="state">Default</div>
    <div class="icon"><i data-lucide="brain" style="width:22px;height:22px;stroke:#E9A123;stroke-width:1.5;fill:none;"></i></div>
    <div class="title">AI-Synthesized Insights</div>
    <div class="text">Claude-powered engine scans thousands of sources daily.</div>
  </div>
  <div class="card hover">
    <div class="state">Hover</div>
    <div class="icon"><i data-lucide="target" style="width:22px;height:22px;stroke:#E9A123;stroke-width:1.5;fill:none;"></i></div>
    <div class="title">Precision Matching</div>
    <div class="text">200+ criteria to surface exactly the tools built for your stack.</div>
  </div>
<script>lucide.createIcons();</script>
</body></html>
