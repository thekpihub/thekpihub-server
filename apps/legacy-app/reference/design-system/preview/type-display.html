<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:30px 28px;background:var(--bg);color:var(--text);width:700px;box-sizing:border-box;}
  .label{font-family:var(--font-head);font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-3);margin-bottom:12px;}
  .specimen{font-family:var(--font-display);font-size:64px;font-weight:800;letter-spacing:-0.03em;line-height:1.05;color:var(--text);}
  .specimen em{font-style:italic;color:var(--gold);}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--text-3);margin-top:18px;letter-spacing:0.04em;}
</style></head><body>
  <div class="label">Display · Source Serif 4</div>
  <div class="specimen"><em>Decision-Grade</em><br>Intelligence.</div>
  <div class="meta">800 · 52–88px · ls -0.03em · lh 1.05 · italic em in gold</div>
</body></html>
