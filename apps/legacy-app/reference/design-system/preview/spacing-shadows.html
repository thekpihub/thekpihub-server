<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:36px 24px;background:var(--bg);color:var(--text);width:700px;box-sizing:border-box;display:flex;gap:24px;align-items:center;justify-content:space-around;}
  .box{width:96px;height:96px;border-radius:12px;background:var(--bg-3);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-family:var(--font-mono);font-size:9px;color:var(--text-3);}
  .s1{box-shadow:0 2px 8px rgba(0,0,0,0.3);}
  .s2{box-shadow:0 8px 24px rgba(0,0,0,0.4);}
  .s3{box-shadow:0 20px 60px rgba(0,0,0,0.55);}
  .g1{background:var(--gold);color:var(--bg);box-shadow:0 0 24px rgba(233,161,35,0.25);}
  .g2{background:var(--gold);color:var(--bg);box-shadow:0 0 50px rgba(233,161,35,0.35);}
  .g3{background:var(--gold);color:var(--bg);box-shadow:0 0 80px rgba(233,161,35,0.55);}
</style></head><body>
  <div class="box s1">sm</div>
  <div class="box s2">md</div>
  <div class="box s3">lg</div>
  <div class="box g1">glow sm</div>
  <div class="box g2">glow md</div>
  <div class="box g3">glow lg</div>
</body></html>
