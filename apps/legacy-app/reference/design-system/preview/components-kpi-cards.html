<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--bg);color:var(--text);width:700px;box-sizing:border-box;display:flex;gap:16px;}
  .fcard{background:rgba(12,14,40,0.92);border:1px solid var(--border);border-radius:10px;padding:14px 18px;min-width:160px;}
  .lbl{font-family:var(--font-head);font-size:10px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--text-3);margin-bottom:6px;}
  .val{font-family:var(--font-head);font-size:1.3rem;font-weight:800;color:var(--text);}
  .up{color:var(--teal);}.down{color:var(--red);}
  .chg{font-size:11px;color:var(--text-3);margin-top:4px;}
</style></head><body>
  <div class="fcard"><div class="lbl">MRR Growth</div><div class="val up">+34.2%</div><div class="chg">↑ vs last quarter</div></div>
  <div class="fcard"><div class="lbl">Churn Rate</div><div class="val down">−12.8%</div><div class="chg">↓ industry avg</div></div>
  <div class="fcard"><div class="lbl">CAC Payback</div><div class="val">8 months</div><div class="chg">Best-in-class</div></div>
</body></html>
