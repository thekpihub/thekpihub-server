<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px 28px;background:var(--bg);color:var(--text);width:700px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;}
  .item{display:flex;align-items:center;gap:14px;font-family:var(--font-mono);font-size:11px;color:var(--text-3);}
  .bar{background:var(--gold);height:14px;border-radius:3px;}
  .tag{min-width:80px;}
</style></head><body>
  <div class="item"><span class="tag">s-1 · 4</span><div class="bar" style="width:4px"></div></div>
  <div class="item"><span class="tag">s-2 · 8</span><div class="bar" style="width:8px"></div></div>
  <div class="item"><span class="tag">s-3 · 12</span><div class="bar" style="width:12px"></div></div>
  <div class="item"><span class="tag">s-4 · 16</span><div class="bar" style="width:16px"></div></div>
  <div class="item"><span class="tag">s-6 · 24</span><div class="bar" style="width:24px"></div></div>
  <div class="item"><span class="tag">s-8 · 32</span><div class="bar" style="width:32px"></div></div>
  <div class="item"><span class="tag">s-12 · 48</span><div class="bar" style="width:48px"></div></div>
  <div class="item"><span class="tag">s-16 · 64</span><div class="bar" style="width:64px"></div></div>
  <div class="item"><span class="tag">s-20 · 80</span><div class="bar" style="width:80px"></div></div>
  <div class="item"><span class="tag">s-24 · 100</span><div class="bar" style="width:100px"></div></div>
</body></html>
