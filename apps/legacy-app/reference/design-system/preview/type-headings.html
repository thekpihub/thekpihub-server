<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px 28px;background:var(--bg);color:var(--text);width:700px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;}
  .row{display:flex;align-items:baseline;gap:18px;border-bottom:1px solid var(--border);padding-bottom:14px;}
  .row:last-child{border:none;padding-bottom:0;}
  .spec{flex:1;}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--text-3);min-width:180px;text-align:right;}
  .h1{font-family:var(--font-display);font-size:42px;font-weight:700;letter-spacing:-0.025em;line-height:1.1;}
  .h2{font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:-0.02em;}
  .h3{font-family:var(--font-head);font-size:18px;font-weight:700;}
</style></head><body>
  <div class="row"><div class="spec h1">From raw data to ready decisions</div><div class="tag">H1 · Source Serif 4 · 700</div></div>
  <div class="row"><div class="spec h2">Intelligence that moves</div><div class="tag">H2 · Source Serif 4 · 700</div></div>
  <div class="row"><div class="spec h3">KPI Intelligence Feed</div><div class="tag">H3 · Beiruti · 700</div></div>
</body></html>
