<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:0;background:var(--bg-2);color:var(--text);width:700px;box-sizing:border-box;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
  .cell{background:var(--bg);padding:32px 16px;text-align:center;}
  .val{font-family:var(--font-display);font-size:44px;font-weight:700;color:var(--gold);line-height:1;margin-bottom:6px;}
  .lbl{font-family:var(--font-head);font-size:10px;font-weight:600;letter-spacing:0.09em;text-transform:uppercase;color:var(--text-3);}
</style></head><body>
  <div class="grid">
    <div class="cell"><div class="val">40+</div><div class="lbl">Data Sources</div></div>
    <div class="cell"><div class="val">6</div><div class="lbl">KPI Categories</div></div>
    <div class="cell"><div class="val">24/7</div><div class="lbl">Automated</div></div>
    <div class="cell"><div class="val">Top 300</div><div class="lbl">India Builder</div></div>
  </div>
</body></html>
