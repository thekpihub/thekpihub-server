<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px 24px;background:var(--bg);color:var(--text);width:700px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;align-items:center;gap:14px;}
  .sw{width:56px;height:56px;border-radius:10px;border:1px solid var(--border);flex-shrink:0;}
  .meta{flex:1;}
  .name{font-family:var(--font-head);font-weight:700;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text);}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--text-3);margin-top:2px;}
  .use{font-family:var(--font-body);font-size:11px;color:var(--text-2);margin-top:3px;}
</style></head><body>
  <div class="row"><div class="sw" style="background:#06071A"></div><div class="meta"><div class="name">Ground · bg</div><div class="hex">#06071A</div><div class="use">Primary page background. Near-black navy — everywhere.</div></div></div>
  <div class="row"><div class="sw" style="background:#0C0E28"></div><div class="meta"><div class="name">Ground · bg-2</div><div class="hex">#0C0E28</div><div class="use">Alternate sections, value-prop strips, CTA blocks.</div></div></div>
  <div class="row"><div class="sw" style="background:#111637"></div><div class="meta"><div class="name">Elevated · bg-3</div><div class="hex">#111637</div><div class="use">Modals, tooltips, floating surfaces.</div></div></div>
  <div class="row"><div class="sw" style="background:#E9A123;box-shadow:0 0 30px rgba(233,161,35,0.45)"></div><div class="meta"><div class="name">Gold · hero accent</div><div class="hex">#E9A123</div><div class="use">CTAs, logo dot, &lt;em&gt; inside headlines, KPI numerals, glow.</div></div></div>
</body></html>
