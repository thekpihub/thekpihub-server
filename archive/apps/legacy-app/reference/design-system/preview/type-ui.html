<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px 28px;background:var(--bg);color:var(--text);width:700px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;}
  .row{display:flex;align-items:center;gap:18px;}
  .spec{flex:1;}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--text-3);min-width:180px;text-align:right;}
  .eyebrow{font-family:var(--font-head);font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);display:inline-flex;align-items:center;gap:12px;}
  .eyebrow::before{content:'';width:28px;height:2px;background:var(--gold);}
  .label{font-family:var(--font-head);font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--text);}
  .body{font-family:var(--font-body);font-size:15px;line-height:1.65;color:var(--text-2);max-width:380px;}
  .meta{font-family:var(--font-body);font-size:12px;color:var(--text-3);}
</style></head><body>
  <div class="row"><div class="spec"><span class="eyebrow">Why The KPI Hub</span></div><div class="tag">Eyebrow · Beiruti 700</div></div>
  <div class="row"><div class="spec"><span class="label">Get Early Access</span></div><div class="tag">Label · Beiruti 700</div></div>
  <div class="row"><div class="spec body">AI-synthesized SaaS intelligence for professionals who act on data, not noise.</div><div class="tag">Body · Manrope 400</div></div>
  <div class="row"><div class="spec meta">No spam. Unsubscribe anytime.</div><div class="tag">Meta · Manrope 400</div></div>
</body></html>
