<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:30px 28px;background:var(--bg);color:var(--text);width:700px;box-sizing:border-box;display:flex;flex-direction:column;gap:24px;}
  .logo-row{display:flex;align-items:center;gap:14px;}
  .logo-dot{width:10px;height:10px;border-radius:50%;background:var(--gold);}
  .logo-text{font-family:var(--font-head);font-size:22px;font-weight:800;letter-spacing:-0.02em;color:var(--text);}
  .logo-text span{color:var(--gold);}
  .mark{width:48px;height:48px;border-radius:10px;background:#06071A;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:26px;font-weight:800;color:var(--gold);border:1px solid var(--border);}
  .caption{font-family:var(--font-mono);font-size:10px;color:var(--text-3);margin-top:6px;}
  .inv{background:#EAEDF5;padding:16px 24px;border-radius:8px;display:inline-flex;align-items:center;gap:14px;}
  .inv .logo-text{color:#06071A;}.inv .logo-text span{color:#E9A123;}
</style></head><body>
  <div><div class="logo-row"><div class="logo-dot"></div><div class="logo-text">The <span>KPI</span> Hub</div></div><div class="caption">Primary lockup — Syne 800 · gold dot + gold "KPI"</div></div>
  <div><div class="logo-row"><div class="mark">K</div><div class="logo-text">The <span>KPI</span> Hub</div></div><div class="caption">Mark + wordmark — favicon pattern</div></div>
  <div><span class="inv"><div class="logo-dot"></div><span class="logo-text">The <span>KPI</span> Hub</span></span><div class="caption">Inverted — on light surface (rare)</div></div>
</body></html>
