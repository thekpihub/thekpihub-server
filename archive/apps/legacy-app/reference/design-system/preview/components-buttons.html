<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:28px 24px;background:var(--bg);color:var(--text);width:700px;box-sizing:border-box;display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .btn-primary{display:inline-flex;align-items:center;gap:10px;padding:14px 30px;background:var(--gold);color:var(--bg);font-family:var(--font-head);font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;border:none;border-radius:8px;box-shadow:0 0 50px rgba(233,161,35,0.35);cursor:pointer;}
  .btn-ghost{display:inline-flex;align-items:center;gap:10px;padding:14px 30px;background:transparent;border:1px solid var(--border);color:var(--text-2);font-family:var(--font-head);font-size:13px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;border-radius:8px;cursor:pointer;}
  .btn-sm{padding:9px 20px;font-size:11px;background:var(--gold);color:var(--bg);font-family:var(--font-head);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;border:none;border-radius:6px;cursor:pointer;}
</style></head><body>
  <button class="btn-primary">Get Early Access →</button>
  <button class="btn-ghost">See How It Works →</button>
  <button class="btn-sm">Join Waitlist</button>
</body></html>
