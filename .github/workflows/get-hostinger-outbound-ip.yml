name: Diagnostic - Get Hostinger server outbound IP

# One-off, read-only diagnostic. Prints the outbound public IP of the
# Hostinger production server (needed to add it to a third-party service's
# IP allowlist, e.g. Brevo). Per repo convention, move to docs/diagnostics/
# after use.

on:
  workflow_dispatch: {}

jobs:
  get-ip:
    runs-on: ubuntu-latest
    environment: hostinger-production
    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
      HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
      HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      HOSTINGER_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/hostinger_deploy_key
          printf '%s\n' "$HOSTINGER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/hostinger_deploy_key
          chmod 644 ~/.ssh/known_hosts

      - name: Get outbound IP from the server itself (both v4 and v6)
        run: |
          ssh -i ~/.ssh/hostinger_deploy_key -p "$HOSTINGER_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$HOSTINGER_USERNAME@$HOSTINGER_HOST" \
            "echo -n 'IPv4: '; curl -s -4 https://api.ipify.org; echo; \
             echo -n 'IPv6: '; curl -s -6 https://api64.ipify.org; echo"
