name: WordPress - keep wp-cron.php ticking

# WordPress's default cron is pseudo-cron: it only runs when a visitor loads a page.
# blog.thekpihub.com is low-traffic, so scheduled posts can sit stuck in the
# 'future' status indefinitely with nothing to trigger the check (found
# 2026-09-04 — 7 posts scheduled for 2026-09-03 06:00 IST were still unpublished
# a day later). Hostinger's shared-hosting SSH shell has no `crontab` command
# (confirmed 2026-09-04 — a real system-cron approach isn't available here), so
# this pings wp-cron.php over plain HTTPS on a schedule instead. No SSH, no
# secrets, just a GET request WordPress already expects to receive periodically.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger wp-cron.php
        run: |
          curl -fsS --max-time 20 "https://blog.thekpihub.com/wp-cron.php" \
            && echo "wp-cron.php responded OK" \
            || echo "::warning::wp-cron.php request failed — will retry on the next 15-minute tick"
