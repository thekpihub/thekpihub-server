name: WP posts diagnostic 2 (temporary, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyMySQL==1.1.1
      - name: Query wp_options cron (read-only)
        env:
          WP_DB_HOST: ${{ secrets.WP_DB_HOST }}
          WP_DB_HOST_IP: ${{ secrets.WP_DB_HOST_IP }}
          WP_DB_PORT: ${{ secrets.WP_DB_PORT }}
          WP_DB_NAME: ${{ secrets.WP_DB_NAME }}
          WP_DB_USER: ${{ secrets.WP_DB_USER }}
          WP_DB_PASSWORD: ${{ secrets.WP_DB_PASSWORD }}
        run: |
          python3 <<'PYEOF'
          import os, pymysql
          def connect(host):
              return pymysql.connect(host=host, port=int(os.environ["WP_DB_PORT"]),
                  user=os.environ["WP_DB_USER"], password=os.environ["WP_DB_PASSWORD"],
                  database=os.environ["WP_DB_NAME"], connect_timeout=15,
                  cursorclass=pymysql.cursors.DictCursor)
          conn = None
          for host in [os.environ.get("WP_DB_HOST"), os.environ.get("WP_DB_HOST_IP")]:
              if not host: continue
              try:
                  conn = connect(host); print(f"Connected via {host}"); break
              except Exception as e:
                  print(f"Connect via {host} failed: {e}")
          if conn is None: raise SystemExit("no connect")
          with conn.cursor() as cur:
              cur.execute("SELECT option_value FROM wp_options WHERE option_name='cron'")
              val = cur.fetchone()["option_value"]
              print("cron option length:", len(val))
              print("contains 'publish_future_post':", "publish_future_post" in val)
              # Print any timestamp keys near known IDs 55-66 range as raw snippet search
              import re
              idx = val.find("publish_future_post")
              print(val[max(0,idx-50):idx+400] if idx != -1 else "(publish_future_post not found anywhere in cron option)")
              cur.execute("SELECT ID, post_status FROM wp_posts WHERE ID IN (55,60,61,62,63,64,65,66)")
              for r in cur.fetchall():
                  print(r)
          conn.close()
          PYEOF
