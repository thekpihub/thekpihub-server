name: One-off - Wire LLM_GATEWAY_URL + GATEWAY_SHARED_SECRET into Hostinger's .htaccess

# One-off, idempotent write. Appends SetEnv lines for LLM_GATEWAY_URL and
# GATEWAY_SHARED_SECRET to the live .htaccess if not already present, so
# ai-gateway.php (2026-09-08, PR #26) can reach the new
# services/llm_gateway HTTP service. Never echoes a raw secret value into
# the log -- values are piped straight into the remote append command via
# stdin, not interpolated into any printed string. Per repo convention,
# move this file to docs/diagnostics/ after use instead of deleting it.

on:
  workflow_dispatch: {}

jobs:
  wire-secrets:
    runs-on: ubuntu-latest
    environment: hostinger-production
    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
      HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
      HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      HOSTINGER_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
      LLM_GATEWAY_URL: ${{ secrets.LLM_GATEWAY_URL }}
      GATEWAY_SHARED_SECRET: ${{ secrets.GATEWAY_SHARED_SECRET }}
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/hostinger_deploy_key
          printf '%s\n' "$HOSTINGER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/hostinger_deploy_key
          chmod 644 ~/.ssh/known_hosts

      - name: Append SetEnv lines if not already present (idempotent, values never echoed)
        run: |
          WEBROOT="/home/$HOSTINGER_USERNAME/domains/thekpihub.com/public_html"
          SSH_CMD="ssh -i ~/.ssh/hostinger_deploy_key -p $HOSTINGER_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes $HOSTINGER_USERNAME@$HOSTINGER_HOST"

          $SSH_CMD "grep -q '^SetEnv LLM_GATEWAY_URL' '$WEBROOT/.htaccess'" \
            && echo "LLM_GATEWAY_URL already present -- skipping" \
            || { printf 'SetEnv LLM_GATEWAY_URL %s\n' "$LLM_GATEWAY_URL" | $SSH_CMD "cat >> '$WEBROOT/.htaccess'"; echo "LLM_GATEWAY_URL appended"; }

          $SSH_CMD "grep -q '^SetEnv GATEWAY_SHARED_SECRET' '$WEBROOT/.htaccess'" \
            && echo "GATEWAY_SHARED_SECRET already present -- skipping" \
            || { printf 'SetEnv GATEWAY_SHARED_SECRET %s\n' "$GATEWAY_SHARED_SECRET" | $SSH_CMD "cat >> '$WEBROOT/.htaccess'"; echo "GATEWAY_SHARED_SECRET appended"; }

      - name: Verify both lines now exist (presence only, values never printed)
        run: |
          WEBROOT="/home/$HOSTINGER_USERNAME/domains/thekpihub.com/public_html"
          ssh -i ~/.ssh/hostinger_deploy_key -p "$HOSTINGER_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$HOSTINGER_USERNAME@$HOSTINGER_HOST" \
            "grep -c '^SetEnv LLM_GATEWAY_URL\|^SetEnv GATEWAY_SHARED_SECRET' '$WEBROOT/.htaccess'"

      - name: Functionally verify the gateway is reachable from the server's own network (values never printed)
        run: |
          WEBROOT="/home/$HOSTINGER_USERNAME/domains/thekpihub.com/public_html"
          SSH_CMD="ssh -i ~/.ssh/hostinger_deploy_key -p $HOSTINGER_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes $HOSTINGER_USERNAME@$HOSTINGER_HOST"
          $SSH_CMD "
            GW_URL=\$(grep -oP '(?<=SetEnv LLM_GATEWAY_URL ).*' '$WEBROOT/.htaccess')
            GW_SECRET=\$(grep -oP '(?<=SetEnv GATEWAY_SHARED_SECRET ).*' '$WEBROOT/.htaccess')
            echo -n 'Gateway health: HTTP '
            curl -s -o /dev/null -w '%{http_code}\n' \"\$GW_URL/health\"
            echo -n 'Gateway /v1/chat (real call): '
            curl -s -X POST \"\$GW_URL/v1/chat\" -H \"Content-Type: application/json\" -H \"X-Gateway-Secret: \$GW_SECRET\" -d '{\"model\":\"claude-sonnet-4-6\",\"prompt\":\"Reply with exactly: OK\",\"max_tokens\":10}'
            echo
          "
