name: KPI Hub Content Pipeline

on:
  schedule:
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    name: Run KPI Hub 5-Engine Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - run: python pipeline.py
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SERPAPI_KEY:          ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          # No live WordPress REST API on this deployment — site files are gone, DB only
          # (see servermemory.md, 2026-09-02). pipeline.py writes straight into wp_ tables.
          WP_SITE_URL:          "https://thekpihub.com"
          WP_DB_HOST:           ${{ secrets.WP_DB_HOST }}
          WP_DB_HOST_IP:        ${{ secrets.WP_DB_HOST_IP }}
          WP_DB_PORT:           ${{ secrets.WP_DB_PORT }}
          WP_DB_NAME:           ${{ secrets.WP_DB_NAME }}
          WP_DB_USER:           ${{ secrets.WP_DB_USER }}
          WP_DB_PASSWORD:       ${{ secrets.WP_DB_PASSWORD }}
          ALPHA_VANTAGE_KEY:    ${{ secrets.ALPHA_VANTAGE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-log-${{ github.run_number }}
          path: services/pipeline/pipeline.log
          retention-days: 7
