name: Publish KPI Signals

# Scheduled worker that reads KPI data from this project's own Supabase database
# (apps/platform's kpis/kpi_values/kpi_targets tables) and publishes global
# decision-feed signals into Supabase module_snapshots.
# See apps/platform/SIGNAL_WIRING_DESIGN_20260713.md for the full design (recreated
# 2026-09-10 — the original was never committed to this repo; see that file's own header note).
#
# Rewritten 2026-09-10 to drop KPIHUB_API_URL / KPIHUB_SERVICE_JWT entirely — the
# external kpihub-backend this originally called was never deployed; KPI data now
# lives directly in this same Supabase project instead (see apps/platform's own
# dashboard/kpi-monitor UI + /api/kpis routes).
#
# Defaults to dry-run (logs computed signals, writes nothing) until the two
# required credentials exist as repo secrets and DRY_RUN is deliberately
# flipped off via the repo variable PUBLISH_SIGNALS_DRY_RUN=false.
# Manual runs (workflow_dispatch) can override dry-run per-run for testing.

on:
  schedule:
    - cron: "17 3 * * *" # ~08:47 IST daily, matches snapshot_date = one row/day
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log computed signals without writing (true/false)"
        required: false
        default: "true"

concurrency:
  group: publish-signals
  cancel-in-progress: false

jobs:
  publish:
    name: Compute + publish signals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/platform/package-lock.json
      - run: npm ci
      - run: npm run publish-signals
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_WORKER_EMAIL: ${{ secrets.SUPABASE_WORKER_EMAIL }}
          SUPABASE_WORKER_PASSWORD: ${{ secrets.SUPABASE_WORKER_PASSWORD }}
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.PUBLISH_SIGNALS_DRY_RUN || 'true' }}
