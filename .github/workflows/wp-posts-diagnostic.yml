name: WP posts diagnostic (temporary, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyMySQL==1.1.1
      - name: Query wp_posts (read-only)
        env:
          WP_DB_HOST: ${{ secrets.WP_DB_HOST }}
          WP_DB_HOST_IP: ${{ secrets.WP_DB_HOST_IP }}
          WP_DB_PORT: ${{ secrets.WP_DB_PORT }}
          WP_DB_NAME: ${{ secrets.WP_DB_NAME }}
          WP_DB_USER: ${{ secrets.WP_DB_USER }}
          WP_DB_PASSWORD: ${{ secrets.WP_DB_PASSWORD }}
        run: |
          python3 <<'PYEOF'
          import os, pymysql

          def connect(host):
              return pymysql.connect(
                  host=host,
                  port=int(os.environ["WP_DB_PORT"]),
                  user=os.environ["WP_DB_USER"],
                  password=os.environ["WP_DB_PASSWORD"],
                  database=os.environ["WP_DB_NAME"],
                  connect_timeout=15,
                  cursorclass=pymysql.cursors.DictCursor,
              )

          conn = None
          for host in [os.environ.get("WP_DB_HOST"), os.environ.get("WP_DB_HOST_IP")]:
              if not host:
                  continue
              try:
                  conn = connect(host)
                  print(f"Connected via {host}")
                  break
              except Exception as e:
                  print(f"Connect via {host} failed: {e}")
          if conn is None:
              raise SystemExit("Could not connect via host or IP")

          with conn.cursor() as cur:
              print("\n=== post_status breakdown (post_type=post) ===")
              cur.execute("SELECT post_status, COUNT(*) AS n FROM wp_posts WHERE post_type='post' GROUP BY post_status")
              for row in cur.fetchall():
                  print(row)

              print("\n=== last 60 posts (any status), newest first ===")
              cur.execute(
                  "SELECT ID, post_status, post_date, post_name, post_title, post_author "
                  "FROM wp_posts WHERE post_type='post' ORDER BY post_date DESC LIMIT 60"
              )
              rows = cur.fetchall()
              for r in rows:
                  print(f'{r["ID"]:>5} | {r["post_status"]:<10} | {r["post_date"]} | author={r["post_author"]} | {r["post_name"][:40]:<40} | {r["post_title"][:60]}')

              print("\n=== titles appearing more than once (possible duplicate content) ===")
              cur.execute(
                  "SELECT post_title, COUNT(*) AS n, GROUP_CONCAT(ID ORDER BY ID) AS ids, "
                  "GROUP_CONCAT(post_status ORDER BY ID) AS statuses, GROUP_CONCAT(post_date ORDER BY ID) AS dates "
                  "FROM wp_posts WHERE post_type='post' GROUP BY post_title HAVING COUNT(*) > 1 ORDER BY n DESC"
              )
              dup_rows = cur.fetchall()
              if not dup_rows:
                  print("(none)")
              for r in dup_rows:
                  print(r)

              print("\n=== distinct post_author values in use ===")
              cur.execute("SELECT post_author, COUNT(*) AS n FROM wp_posts WHERE post_type='post' GROUP BY post_author")
              for row in cur.fetchall():
                  print(row)

          conn.close()
          PYEOF
