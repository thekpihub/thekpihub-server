# ─────────────────────────────────────────────────────────────────────────────
# KPI Hub — 48-Hour Intelligence Pipeline
# Schedule: Every 2 days at 15:03 IST (09:33 UTC)
# Publishes Premium Content: Deep-dive analyses, trend reports, benchmark studies
# Ported from thekpihub/thekpihub-website (root .github/workflows/ only runs
# for the repo it lives in — this monorepo needs its own root-level copy).
#
# Deliberately NOT 03:03 AM IST (21:33 UTC) — that's daily-pipeline.yml's slot, and
# both workflows run the exact same apps/website/pipeline.py. Sharing a cron time
# meant on every odd day, two runs of the same script raced to publish the same
# date-based article slugs at once. Idempotency-by-slug mostly caught it, but the
# race window was real. Fixed 2026-09-02 by moving this to a different time of day
# instead — daily-pipeline.yml still runs once every day, this still runs every
# 2 days, they just no longer land in the same few minutes.
# ─────────────────────────────────────────────────────────────────────────────
name: 48-Hour Premium Pipeline

on:
  schedule:
    - cron: "33 9 1-31/2 * *"   # Every odd day at 15:03 IST — offset from daily-pipeline.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip WP publish + Telegram)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: kpihub-premium-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-premium-pipeline:
    name: "🎯 Premium Pipeline — ${{ github.event.inputs.dry_run == 'true' && 'DRY RUN' || 'LIVE' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/website

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Fallback when the direct Anthropic account is rate/usage-capped --
      # pipeline.py's claude_call() retries direct Anthropic first, then
      # falls back to the same model via OpenRouter (separate billing), then
      # to MindStudio.ai's Service Router (a third, independent billing
      # relationship -- see services/llm_gateway/README.md).
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MINDSTUDIO_API_KEY: ${{ secrets.MINDSTUDIO_API_KEY }}
      MINDSTUDIO_APP_ID:  ${{ secrets.MINDSTUDIO_APP_ID }}
      SERPAPI_KEY:        ${{ secrets.SERPAPI_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      # No live WordPress REST API on this deployment — site files are gone, DB only
      # (see servermemory.md, 2026-09-02). pipeline.py writes straight into wp_ tables.
      WP_SITE_URL:        "https://thekpihub.com"
      WP_DB_HOST:         ${{ secrets.WP_DB_HOST }}
      WP_DB_HOST_IP:      ${{ secrets.WP_DB_HOST_IP }}
      WP_DB_PORT:         ${{ secrets.WP_DB_PORT }}
      WP_DB_NAME:         ${{ secrets.WP_DB_NAME }}
      WP_DB_USER:         ${{ secrets.WP_DB_USER }}
      WP_DB_PASSWORD:     ${{ secrets.WP_DB_PASSWORD }}
      CLAUDE_MODEL:       "claude-opus-5"
      DRY_RUN:            ${{ github.event.inputs.dry_run || 'false' }}
      PIPELINE_TYPE:      "premium"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/website/requirements.txt

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Run premium intelligence pipeline
        id: pipeline
        run: python pipeline.py ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-pipeline-logs-${{ github.run_id }}
          path: |
            apps/website/pipeline_premium.log
            apps/website/reports/
          retention-days: 14

      - name: Notify Telegram on failure
        if: failure()
        run: |
          MESSAGE="❌ *KPI Hub Premium Pipeline FAILED*%0A"
          MESSAGE+="Run: \"${{ github.run_id }}\"%0A"
          MESSAGE+="Branch: ${{ github.ref_name }}%0A"
          MESSAGE+="Triggered by: ${{ github.event_name }}%0A"
          MESSAGE+="Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=Markdown"
