# ─────────────────────────────────────────────────────────────────────────────
# KPI Hub — Daily Intelligence Pipeline
# Schedule: 03:03 AM IST = 21:33 UTC (previous calendar day)
# Publishes 7 articles to WordPress, live at 06:00 AM IST
# Ported from thekpihub/thekpihub-website (root .github/workflows/ only runs
# for the repo it lives in — this monorepo needs its own root-level copy).
# ─────────────────────────────────────────────────────────────────────────────
name: Daily Intelligence Pipeline

on:
  schedule:
    - cron: "33 21 * * *"   # 03:03 AM IST every day
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip WP publish + Telegram)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: kpihub-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: "🚀 KPI Hub Pipeline — ${{ github.event.inputs.dry_run == 'true' && 'DRY RUN' || 'LIVE' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/website

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Fallback when the direct Anthropic account is rate/usage-capped --
      # pipeline.py's claude_call() retries direct Anthropic first, then
      # falls back to the same model via OpenRouter (separate billing).
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SERPAPI_KEY:        ${{ secrets.SERPAPI_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      # No live WordPress REST API on this deployment — site files are gone, DB only
      # (see servermemory.md, 2026-09-02). pipeline.py writes straight into wp_ tables.
      WP_SITE_URL:        "https://thekpihub.com"
      WP_DB_HOST:         ${{ secrets.WP_DB_HOST }}
      WP_DB_HOST_IP:      ${{ secrets.WP_DB_HOST_IP }}
      WP_DB_PORT:         ${{ secrets.WP_DB_PORT }}
      WP_DB_NAME:         ${{ secrets.WP_DB_NAME }}
      WP_DB_USER:         ${{ secrets.WP_DB_USER }}
      WP_DB_PASSWORD:     ${{ secrets.WP_DB_PASSWORD }}
      CLAUDE_MODEL:       "claude-sonnet-5"
      DRY_RUN:            ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/website/requirements.txt

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Run intelligence pipeline
        id: pipeline
        run: python pipeline.py ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            apps/website/pipeline.log
            apps/website/reports/
          retention-days: 14

      - name: Notify Telegram on failure
        if: failure()
        run: |
          MESSAGE="❌ *KPI Hub Pipeline FAILED*%0A"
          MESSAGE+="Run: \`${{ github.run_id }}\`%0A"
          MESSAGE+="Branch: ${{ github.ref_name }}%0A"
          MESSAGE+="Triggered by: ${{ github.event_name }}%0A"
          MESSAGE+="Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=Markdown"
