# ─────────────────────────────────────────────────────────────────────────────
# One-off, temporary workflow (2026-09-04) to fix the 51 Dependabot alerts in
# this repo's 3 Node apps (apps/wingcommander-reference, apps/legacy-app,
# tools/automated-website-builder) -- no Node/npm is available in the local
# dev environment, so this runs the real `npm audit fix` + build/test
# verification on a GitHub Actions runner instead, then commits the result to
# a branch for review. Not run automatically (no schedule/push trigger) --
# workflow_dispatch only. Once used, move to docs/diagnostics/ per this
# repo's established one-off-workflow lifecycle (see
# docs/diagnostics/check-authorized-keys.yml for the precedent), don't delete.
# ─────────────────────────────────────────────────────────────────────────────
name: (one-off) Dependabot fixes for Node apps

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which app to fix"
        required: true
        type: choice
        options: ["wingcommander-reference", "legacy-app-and-builder"]

permissions:
  contents: write

jobs:
  wingcommander-reference:
    if: github.event.inputs.target == 'wingcommander-reference'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install (baseline)
        working-directory: apps/wingcommander-reference
        run: npm ci

      # multer's 8 DoS advisories all need the 1.x -> 2.x major bump; plain
      # `npm audit fix` won't cross a major version on its own. Usage in
      # backend/src/routes/rag.ts is the standard memoryStorage +
      # fileFilter(cb(err, bool)) + single()/array() pattern, which multer's
      # own 2.x migration notes say is unchanged -- explicit bump instead of
      # blind --force, so this doesn't also drag in unrelated major bumps.
      - name: Bump multer to 2.x (backend)
        working-directory: apps/wingcommander-reference/backend
        run: npm install multer@^2.2.0

      - name: Auto-fix everything else non-breaking
        working-directory: apps/wingcommander-reference
        run: npm audit fix || true

      - name: Re-install from the updated lockfile
        working-directory: apps/wingcommander-reference
        run: npm ci

      - name: Verify — same build CI already runs
        working-directory: apps/wingcommander-reference
        run: npm run build

      - name: Verify — remaining audit
        working-directory: apps/wingcommander-reference
        run: npm audit --audit-level=moderate || true

      - name: Commit + push fix branch (only if build passed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b fix/dependabot-wingcommander-reference
          git add apps/wingcommander-reference
          if git diff --cached --quiet; then
            echo "No changes to commit"; exit 0
          fi
          git commit -m "fix(deps): resolve wingcommander-reference Dependabot alerts

Bumps multer 1.x -> 2.2.0 (fixes 8 DoS advisories -- usage in rag.ts is
the standard memoryStorage/fileFilter/single()/array() pattern, unchanged
across multer's major version per its own migration notes) plus npm audit
fix for the remaining non-breaking transitive-dependency advisories
(brace-expansion, browserslist, js-yaml, nanoid, postcss,
postcss-selector-parser, body-parser, qs, react-router). Verified: npm run
build (same command apps/wingcommander-reference's CI step already runs)
passes on the updated lockfile.

Generated by the one-off dependabot-fix-node-apps.yml workflow.

Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>"
          git push -u origin fix/dependabot-wingcommander-reference --force

  legacy-app-and-builder:
    if: github.event.inputs.target == 'legacy-app-and-builder'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: legacy-app (root) — audit fix + verify
        working-directory: apps/legacy-app
        run: |
          npm ci
          npm audit fix || true
          npm ci
          npm run lint
          npm run build

      - name: "legacy-app/backend — audit fix + verify (not in main CI, only verified here)"
        working-directory: apps/legacy-app/backend
        run: |
          npm ci
          npm audit fix || true
          npm ci
          npm test

      - name: automated-website-builder — audit fix + verify
        working-directory: tools/automated-website-builder
        run: |
          npm ci
          npm audit fix || true
          npm ci
          npm test

      - name: Remaining audit (all 3, informational)
        run: |
          (cd apps/legacy-app && npm audit --audit-level=moderate || true)
          (cd apps/legacy-app/backend && npm audit --audit-level=moderate || true)
          (cd tools/automated-website-builder && npm audit --audit-level=moderate || true)

      - name: Commit + push fix branch (only if verification passed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b fix/dependabot-legacy-app-and-builder
          git add apps/legacy-app tools/automated-website-builder
          if git diff --cached --quiet; then
            echo "No changes to commit"; exit 0
          fi
          git commit -m "fix(deps): resolve apps/legacy-app + tools/automated-website-builder Dependabot alerts

npm audit fix (non-force) across all 3 manifests (apps/legacy-app root,
apps/legacy-app/backend, tools/automated-website-builder) -- all 14
alerts here are non-breaking transitive-dependency bumps (brace-expansion,
browserslist, js-yaml, body-parser, qs). Verified: each app's own
lint/build/test command passes on the updated lockfile (apps/legacy-app's
backend and this builder tool aren't in main CI's validate job, so this
is their only verification).

Generated by the one-off dependabot-fix-node-apps.yml workflow.

